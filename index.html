<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dungeon Escape: Fable vs Opus</title>
  <link rel="icon" href="data:,">
  <style>
    :root { --bg: #0d0d12; --panel: #16161f; --line: #2c2c3a; --text: #ececf2; --muted: #8b8ba0; --fable: #eb785a; --opus: #9db4ff; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    main { max-width: 1100px; margin: 0 auto; padding: 48px 16px 64px; }
    h1 { margin: 0 0 8px; font-size: clamp(24px, 5vw, 40px); letter-spacing: 0.02em; }
    h1 .f { color: var(--fable); } h1 .o { color: var(--opus); } h1 .vs { color: var(--muted); font-size: 0.6em; }
    p.lead { margin: 0 0 32px; color: var(--muted); max-width: 60ch; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; }
    a.card { display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; color: inherit; text-decoration: none; transition: transform .12s, border-color .12s; }
    a.card:hover, a.card:focus-visible { transform: translateY(-3px); border-color: var(--accent); outline: none; }
    .card img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; image-rendering: pixelated; border-bottom: 1px solid var(--line); }
    .card .body { padding: 16px 18px 18px; }
    .card h2 { margin: 0 0 4px; font-size: 22px; color: var(--accent); }
    .card p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
    .card .play { font-weight: 700; color: var(--accent); }
    .fable { --accent: var(--fable); } .opus { --accent: var(--opus); }
    footer { margin-top: 40px; color: var(--muted); font-size: 13px; }
    footer a { color: var(--text); }
  </style>
</head>
<body>
  <main>
    <h1><span class="f">Fable</span> <span class="vs">vs</span> <span class="o">Opus</span></h1>
    <p class="lead">Two versions of the same browser game, Dungeon Escape, each built by a different Claude model. Pick one and play.</p>
    <div class="grid">
      <a class="card fable" href="dungeon-escape-fable/">
        <img src="fable.png" alt="Screenshot of the Fable version of Dungeon Escape">
        <div class="body">
          <h2>Fable</h2>
          <p>Dungeon Escape, built by Claude Fable.</p>
          <span class="play">Play &rarr;</span>
        </div>
      </a>
      <a class="card opus" href="dungeon-escape-opus/">
        <img src="opus.png" alt="Screenshot of the Opus version of Dungeon Escape">
        <div class="body">
          <h2>Opus</h2>
          <p>Dungeon Escape, built by Claude Opus.</p>
          <span class="play">Play &rarr;</span>
        </div>
      </a>
    </div>
    <footer>Source: <a href="https://github.com/OpenVibes/hobby-experiments">OpenVibes/hobby-experiments</a></footer>
  </main>
</body>
</html>
